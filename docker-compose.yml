services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cowork
      POSTGRES_PASSWORD: cowork
      POSTGRES_DB: cowork
    # Exposed so the backend can also be run outside Docker against this database.
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cowork -d cowork']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 4000
      TLZ: UTC
      DATABASE_URL: postgresql://cowork:cowork@db:5432/cowork
      JWT_ACCESS_SECRET: dev-access-secret-change-me
      JWT_REFRESH_SECRET: dev-refresh-secret-change-me
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:5173
      AUTH_RATE_LIMIT_WINDOW_MS: 900000
      AUTH_RATE_LIMIT_MAX: 10
    # Migrations run on boot; the seed only fills an empty database.
    command: sh -c "node src/db/seed.js --if-empty && node src/server.js"
    ports:
      - '4000:4000'
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
